<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VBA工作站</title>

<style>

body{
    margin:0;
    font-family:"Microsoft JhengHei";
    background:#0f172a;
    color:white;
}

.header{
    padding:60px 30px;
    text-align:center;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
}

.header h1{
    font-size:48px;
    margin:0;
}

.header p{
    margin-top:15px;
    font-size:18px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:40px;
}

.card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:#1e293b;
    border-radius:16px;
    padding:25px;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
    background:#334155;
}

.card h3{
    margin-top:0;
}

.btn{
    display:inline-block;
    margin-top:15px;
    padding:10px 18px;
    border-radius:10px;
    background:#3b82f6;
    text-decoration:none;
    color:white;
    font-weight:bold;
    border:none;
    cursor:pointer;
}

.btn:hover{
    background:#2563eb;
}

.notice{
    margin-top:30px;
    padding:20px;
    background:#172554;
    border-left:5px solid #60a5fa;
    border-radius:10px;
}

.footer{
    text-align:center;
    margin-top:60px;
    padding:20px;
    color:#94a3b8;
}

.home-btn{
    background:#10b981;
}

.home-btn:hover{
    background:#059669;
}

</style>

</head>

<body>

<div class="header">

<h1>🚀 VBA工作站</h1>

<p>
V2.6 Enterprise Automation Workstation
</p>

</div>

<div class="container">

<div class="card-grid">

<div class="card">

<h3>🚀 啟動工作站</h3>

<p>
已同步使用者請直接使用桌面捷徑啟動。
</p>

<button class="btn"
onclick="alert('已同步使用者請直接由桌面捷徑【🚀 VBA工作站】啟動');">
已同步使用者
</button>

</div>

<div class="card">

<h3>📥 首次使用</h3>

<p>
同步數位工作平台文件庫後，
執行建立桌面捷徑。
</p>

<button class="btn"
onclick="alert('第一次使用步驟：\n\n1. 開啟 SharePoint 文件庫\n2. 點選【同步】\n3. 等待 OneDrive 完成同步\n4. 執行【建立桌面捷徑】\n5. 之後由桌面啟動 VBA工作站');">
同步教學
</button>

</div>

<div class="card">

<h3>📚 使用手冊</h3>

<p>
工作站完整操作說明。
</p>

<button class="btn"
onclick="alert('請將此按鈕改連至 SharePoint 使用手冊網址');">
開啟手冊
</button>

</div>

<div class="card">

<h3>📦 模組中心</h3>

<p>
Core、Packages、Templates。
</p>

<button class="btn"
onclick="alert('請將此按鈕改連至 SharePoint 模組中心網址');">
查看模組
</button>

</div>

</div>

<div class="notice">

<h3>💡 啟動方式</h3>

<p>
第一次使用：
<br><br>

① SharePoint 文件庫同步
<br>
② 執行 建立桌面捷徑
<br>
③ 桌面出現「🚀 VBA工作站」
<br>
④ 直接由桌面啟動
<br><br>

已同步使用者：
<br>
請直接執行桌面捷徑
</p>

<button class="btn home-btn"
onclick="window.location.href='index.html';">
🏠 返回首頁
</button>

</div>

</div>

<div class="footer">

Barry Digital Workspace © 2026

</div>

</body>

</html>
